server {
  listen 8085;
  listen [::]:8085;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # assets com hash do Vite: cache agressivo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /app/assess/<id> e demais rotas client-side caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
